apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cathedral-telemetry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cathedral-telemetry
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cathedral-telemetry
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cathedral-telemetry
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

