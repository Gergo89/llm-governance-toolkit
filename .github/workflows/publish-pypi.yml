name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (optional, uses tag if not provided)'
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/project/llm-governance-toolkit/

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            llm-governance-toolkit/pyproject.toml
            llm-governance-toolkit/requirements.txt

      - name: Confirm package metadata exists
        run: |
          test -f llm-governance-toolkit/pyproject.toml
          ls -la llm-governance-toolkit

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify package
        working-directory: ./llm-governance-toolkit
        run: |
          python -m build --sdist --wheel .
          twine check dist/*

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./llm-governance-toolkit/dist/
          verbose: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: llm-governance-toolkit/dist/
          retention-days: 30
