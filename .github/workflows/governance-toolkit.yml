name: Compliance Toolkit

on:
  push:
    branches: [main]
    paths: ["compliance-toolkit/**", ".github/workflows/governance-toolkit.yml"]
  pull_request:
    paths: ["compliance-toolkit/**", ".github/workflows/governance-toolkit.yml"]
  schedule:
    # Weekly drift check: catches assessments that have gone stale since merge.
    - cron: "17 6 * * 1"

defaults:
  run:
    working-directory: compliance-toolkit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q

  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      # The shipped example registry contains a deliberately non-compliant
      # use case, so the gate is expected to fail here. Point --registry at
      # your own registry and delete `continue-on-error` when you adopt this.
      - name: Validate AI use-case registry
        continue-on-error: true
        run: llmgov validate --registry registry/use-cases --fail-on high
      - name: Portfolio report
        run: |
          mkdir -p reports
          llmgov report -o reports/portfolio.md
      - uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: compliance-toolkit/reports/portfolio.md
