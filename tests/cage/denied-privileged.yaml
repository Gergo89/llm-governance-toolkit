apiVersion: v1
kind: Pod
metadata:
  name: denied-privileged
  namespace: cage-contract-test
spec:
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.10
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

