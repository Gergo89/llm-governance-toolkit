[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-governance-toolkit"
version = "0.1.0"
description = "Deterministic reference implementations for applied LLM governance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gergo89"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.24,<3",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/Gergo89/llm-governance-toolkit"
Issues = "https://github.com/Gergo89/llm-governance-toolkit/issues"

[tool.setuptools]
packages = [
  "llm_governance_toolkit",
  "llm_governance_toolkit.tools",
  "llm_governance_toolkit.patterns",
  "llm_governance_toolkit.soi",
]

[tool.setuptools.package-dir]
llm_governance_toolkit = "."
"llm_governance_toolkit.tools" = "tools"
"llm_governance_toolkit.patterns" = "patterns"
"llm_governance_toolkit.soi" = "soi"

[tool.setuptools.package-data]
"llm_governance_toolkit.tools" = ["*.md", "*.png"]
"llm_governance_toolkit.patterns" = ["*.md"]
"llm_governance_toolkit.soi" = ["*.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "stress: exhaustive or performance-sensitive tests excluded from the fast PR suite",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
